input {
  http {
    port => "${PORT}"
    user => "${USER}"
    password => "${PASSWORD}"
    codec => plain {
      charset => "UTF-8"
      ecs_compatibility => "v1"
    }
  }
}

filter {
  # --- Routage Sekoia -------------------------------------------------------
  # Chaque drain Scalingo est identifié uniquement par le chemin de son URL
  # (/<drain>). Un drain sans chemin n'est jamais envoyé à Sekoia.
  # Le stream vaut :
  #   <drain>             si le drain se termine par -postgres (drain d'addon)
  #   <drain>-router      si hostname=router (logs du router Scalingo)
  #   <drain>-app         sinon (stdout des conteneurs)
  # Seuls les streams présents dans le dictionnaire sont envoyés à Sekoia.
  grok {
    match => { "[url][path]" => "^/(?<[@metadata][sekoia][drain]>[^/?]*)(?:\?(?<[@metadata][sekoia][query]>.*))?$" }
    tag_on_failure => []
  }

  kv {
    source => "[@metadata][sekoia][query]"
    field_split => "&"
    target => "[@metadata][sekoia][params]"
  }

  if [@metadata][sekoia][drain] {
    if [@metadata][sekoia][drain] =~ /-postgres$/ {
      mutate {
        add_field => { "[@metadata][sekoia][stream]" => "%{[@metadata][sekoia][drain]}" }
      }
    } else if [@metadata][sekoia][params][hostname] == "router" {
      mutate {
        add_field => { "[@metadata][sekoia][stream]" => "%{[@metadata][sekoia][drain]}-router" }
      }
    } else {
      mutate {
        add_field => { "[@metadata][sekoia][stream]" => "%{[@metadata][sekoia][drain]}-app" }
      }
    }
  }

  # Stream -> clé d'intake. Chaque variable référencée doit exister sur
  # Scalingo, sinon Logstash ne démarre pas : n'ajouter une ligne qu'une fois
  # l'intake créée.
  translate {
    source => "[@metadata][sekoia][stream]"
    target => "[@metadata][sekoia][intake_key]"
    dictionary => {
      # Router Scalingo : une seule intake pour toutes les apps
      "prod-pilote-ditp-router"    => "${SEKOIA_KEY_SCALINGO_ROUTER}"
      "prod-keycloak-ditp-router"  => "${SEKOIA_KEY_SCALINGO_ROUTER}"
      "prod-kpilote-api-router"    => "${SEKOIA_KEY_SCALINGO_ROUTER}"
      "prod-kpilote-webapp-router" => "${SEKOIA_KEY_SCALINGO_ROUTER}"

      # Addons PostgreSQL
      # "prod-pilote-ditp-postgres"   => "${SEKOIA_KEY_PILOTE_POSTGRES}"
      # "prod-keycloak-ditp-postgres" => "${SEKOIA_KEY_KEYCLOAK_POSTGRES}"
      # "prod-kpilote-api-postgres"   => "${SEKOIA_KEY_KPILOTE_POSTGRES}"

      # Logs applicatifs
      # "prod-keycloak-ditp-app" => "${SEKOIA_KEY_KEYCLOAK}"
    }
  }
  # --------------------------------------------------------------------------

  # Extraire les champs depuis le message brut
  grok {
    match => { 
      "message" => "method=%{NOTSPACE:method} path=%{QUOTEDSTRING:path} host=%{NOTSPACE:host} request_id=%{NOTSPACE:request_id} container=%{NOTSPACE:container} from=%{QUOTEDSTRING:ip} protocol=%{NOTSPACE:protocol} status=%{NUMBER:status} duration=%{NOTSPACE:duration} bytes=%{NUMBER:bytes} referer=%{QUOTEDSTRING:referer} user_agent=%{QUOTEDSTRING:user_agent}(?: error=%{GREEDYDATA:error_message})?" 
    }

    target => "[logstash]"
  }

  # Détecter l'environnement selon le host
  if [logstash][host] == "pilote.modernisation.gouv.fr" {
    mutate {
      add_field => { "[logstash][source]" => "prod-pilote-ditp" }
    }
  } else if [logstash][host] in ["dev.pilote.modernisation.gouv.fr", "dev-pilote-ditp.osc-secnum-fr1.scalingo.io"] {
    mutate {
      add_field => { "[logstash][source]" => "dev-pilote-ditp" }
    }
  }

  mutate {
    remove_field => ["headers", "message", "http", "url_params"]
  }
}

output {
  # Envoi du log brut vers Sekoia.io (zone FRA2)
  if [@metadata][sekoia][intake_key] {
    http {
      url => "https://intake.fra2.sekoia.io/api/v1/intake-http/array"
      http_method => "post"
      format => "json_batch"
      mapping => {
        "intake_key" => "%{[@metadata][sekoia][intake_key]}"
        "json" => "%{[event][original]}"
      }
    }
  }

  # Seuls les drains historiques alimentent Elasticsearch : les drains sans
  # chemin (dev-pilote-ditp, ancien drain prod) et /prod-pilote-ditp
  if "_grokparsefailure" in [tags] and (![@metadata][sekoia][drain] or [@metadata][sekoia][drain] == "prod-pilote-ditp") {
    elasticsearch {
      hosts => "${ELASTICSEARCH_HOST}"
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "logstash-grok-failures-%{+YYYY.MM.dd}"
      ilm_policy => "pilote_policy"
      ilm_enabled => true
      manage_template => false
    }
  }

  if ([logstash][source] == "dev-pilote-ditp") {
    elasticsearch {
      hosts => "${ELASTICSEARCH_HOST}"
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "pilote-dev-%{+YYYY.MM.dd}"
      ilm_policy => "pilote_policy"
      ilm_enabled => true
      manage_template => false
    }
  } else if ([logstash][source] == "prod-pilote-ditp") {
    elasticsearch {
      hosts => "${ELASTICSEARCH_HOST}"
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "pilote-prod-%{+YYYY.MM.dd}"
      ilm_policy => "pilote_policy"
      ilm_enabled => true
      manage_template => false
    }
  }
}
